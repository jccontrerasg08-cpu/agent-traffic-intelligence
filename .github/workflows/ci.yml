name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest --cov=agent_traffic_intelligence --cov-report=term-missing

      - name: Compile
        run: python -m compileall -q src

      - name: CLI smoke
        env:
          ATI_HASH_KEY: ci-synthetic-key
        run: |
          ati registry validate
          ati analyze examples/data/access.jsonl --source nginx --output /tmp/detections.jsonl
          test "$(wc -l < /tmp/detections.jsonl)" -eq 2
