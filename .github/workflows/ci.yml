name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Install local package without resolving dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest

      - name: Compile
        run: python -m compileall -q src

      - name: CLI smoke
        env:
          ATI_HASH_KEY: ci-synthetic-key
          ATI_SOURCE_CACHE: /tmp/ati-source-cache
        run: |
          ati registry validate
          ati sources status > /tmp/source-status.json
          ati sources validate
          ati analyze examples/data/access.jsonl --source nginx --output /tmp/detections.jsonl
          test "$(wc -l < /tmp/detections.jsonl)" -eq 2
          if grep -q '"verification"' /tmp/detections.jsonl; then exit 1; fi

  verification:
    name: Verification Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked verification dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Install local package without resolving dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Full verification test suite with coverage
        run: pytest --cov=agent_traffic_intelligence --cov-report=term-missing

      - name: Verified identity CLI smoke
        env:
          ATI_HASH_KEY: ci-synthetic-key
          ATI_SOURCE_CACHE: /tmp/ati-source-cache
        run: |
          ati analyze examples/data/access.jsonl --source nginx --verify-identity --output /tmp/verified.jsonl
          test "$(wc -l < /tmp/verified.jsonl)" -eq 2

  package:
    name: Package build and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Build wheel and source distribution
        run: |
          python -m build --no-isolation
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Install wheel outside source tree
        run: |
          python -m venv /tmp/ati-wheel
          /tmp/ati-wheel/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          cd /tmp
          /tmp/ati-wheel/bin/ati registry validate
          /tmp/ati-wheel/bin/python - <<'PY'
          from importlib.metadata import metadata
          from agent_traffic_intelligence.identity.profiles import provider_profile

          assert provider_profile("openai").provider == "openai"
          requires = metadata("agent-traffic-intelligence").get_all("Requires-Dist") or []
          assert any("http-message-signatures" in item and "verification" in item for item in requires)
          PY
