name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest

      - name: Compile
        run: python -m compileall -q src

      - name: CLI smoke
        env:
          ATI_HASH_KEY: ci-synthetic-key
          ATI_SOURCE_CACHE: /tmp/ati-source-cache
        run: |
          ati registry validate
          ati sources status > /tmp/source-status.json
          ati sources validate
          ati analyze examples/data/access.jsonl --source nginx --output /tmp/detections.jsonl
          test "$(wc -l < /tmp/detections.jsonl)" -eq 2
          if grep -q '"verification"' /tmp/detections.jsonl; then exit 1; fi

  verification:
    name: Verification Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "http-message-signatures>=2.0.1,<3"

      - name: Full verification test suite with coverage
        run: pytest --cov=agent_traffic_intelligence --cov-report=term-missing

      - name: Verified identity CLI smoke
        env:
          ATI_HASH_KEY: ci-synthetic-key
          ATI_SOURCE_CACHE: /tmp/ati-source-cache
        run: |
          ati analyze examples/data/access.jsonl --source nginx --verify-identity --output /tmp/verified.jsonl
          test "$(wc -l < /tmp/verified.jsonl)" -eq 2
