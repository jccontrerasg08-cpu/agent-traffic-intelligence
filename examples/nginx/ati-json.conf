# Place `map` directives inside the Nginx `http {}` context.
map $http_referer $ati_has_referer { "" false; default true; }
map $http_cookie $ati_has_cookie { "" false; default true; }
map $http_accept_language $ati_has_accept_language { "" false; default true; }

# `$uri` is used instead of `$request_uri` to avoid logging query-string values.
# Raw remote_addr is accepted because ATI immediately pseudonymizes it at ingest;
# keep this source log protected and short-lived, or provide a pre-pseudonymized client_id upstream.
log_format ati_json escape=json
  '{'
    '"time_iso8601":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"server_protocol":"$server_protocol",'
    '"http_user_agent":"$http_user_agent",'
    '"has_referer":$ati_has_referer,'
    '"has_cookie":$ati_has_cookie,'
    '"has_accept_language":$ati_has_accept_language'
  '}';

# access_log /var/log/nginx/ati.jsonl ati_json;
